name: Live API Tests

# Calls Foreca's real API to catch a change the mocked suite cannot see. Manual only,
# never on a pull request, and the key is a secret of the foreca-api environment,
# which waits for a reviewer's approval before the job can read it. Information, not
# a gate: no ruleset requires this check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Foreca live API
    runs-on: ubuntu-latest
    environment: foreca-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install
        run: uv pip install --system -r requirements.test.txt
      - name: Pytest
        env:
          FORECA_API_KEY: ${{ secrets.FORECA_API_KEY }}
        run: python -m pytest tests_live/ -p no:homeassistant -q
