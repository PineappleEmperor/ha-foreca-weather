rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions.
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  entity-event-setup:
    status: exempt
    comment: Entities read the coordinator and subscribe to nothing themselves.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  config-entry-unloading: done
  log-when-unavailable: done
  entity-unavailable: done
  action-exceptions:
    status: exempt
    comment: The integration registers no actions.
  reauthentication-flow: done
  parallel-updates: done
  test-coverage: done
  integration-owner: done
  docs-installation-parameters: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options flow.

  # Gold
  entity-translations: done
  entity-device-class: done
  devices: done
  entity-category:
    status: exempt
    comment: Every entity is a primary weather reading; none is configuration or diagnostic.
  entity-disabled-by-default: done
  discovery:
    status: exempt
    comment: A cloud service has nothing on the network to discover.
  stale-devices:
    status: exempt
    comment: Each entry has one service device, which goes when the entry does.
  diagnostics: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  dynamic-devices:
    status: exempt
    comment: Each entry has one service device, created at setup.
  discovery-update-info:
    status: exempt
    comment: A cloud service has nothing on the network to discover.
  repair-issues:
    status: exempt
    comment: The one condition a user must act on, a rejected API key, is the reauthentication flow.
  docs-use-cases: done
  docs-supported-devices:
    status: exempt
    comment: A cloud service with no devices to support.
  docs-supported-functions: done
  docs-data-update: done
  docs-known-limitations: done
  docs-troubleshooting: done
  docs-examples: done

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
